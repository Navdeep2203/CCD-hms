
server {
    listen 8080;
    server_name _;

    # Hide the detailed NGINX version in response headers and error pages.
    # This reduces version disclosure but does not remove the Server header entirely.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip for text-based assets to reduce response transfer sizes.
    # Vary tells caches that the response can differ by Accept-Encoding.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        image/svg+xml;

    # Hashed Vite asset filenames change when their contents change,
    # so these assets can safely use long-lived immutable caching.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # NGINX's traditional add_header inheritance is all-or-nothing:
        # defining add_header here prevents inheriting server-level add_header
        # directives. Apply future security headers here as well, preferably
        # through a shared include, and verify the resulting response headers.
    }

    # Revalidate the HTML entry point so users can discover new frontend builds.
    location = /index.html {
        add_header Cache-Control "no-cache";

        # This location has its own add_header directive, so future server-level
        # security headers may not be inherited here. Keep them consistent.
    }

    # Serve real files when present; otherwise let React Router handle the route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
